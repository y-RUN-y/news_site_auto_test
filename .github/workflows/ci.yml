name: CI & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-pixi@v4

      - run: pixi install

      - run: pixi run install-playwright

      - run: pixi run lint

      - run: pixi run run

      - name: Generate Allure report
        run: |
          pixi run test
          allure generate ./report/json -o ./report/html --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: report/html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        run: |
          if ! git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git checkout --orphan gh-pages
            git rm -rf .
          else
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          fi
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: .

      - name: Deploy
        run: |
          cp -r report/html/* . || true
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update test report"
          git push -f origin gh-pages
        shell: bash

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Tencent News Test Report - ${{ github.run_number }}
          to: 2080554836@qq.com
          from: Test Automation
          body: |
            Test run #${{ github.run_number }} completed.
            Status: ${{ needs.test.result }}
            Report: https://${{ github.repository }}.github.io/${{ github.event.repository.name }}/