name: CI & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - run: pixi install

      - run: pixi run npm install -g allure

      - run: pixi run install-playwright 

      - run: pixi run test

      - run: pixi run allure generate ./report/json -o ./report/html

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-report
          path: report/html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Download allure report
        uses: actions/download-artifact@v5
        with:
          name: allure-report
          path: ./report_temp

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report_temp
          keep_files: false  # 完全覆盖 gh-pages 分支

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          secure: false
          subject: Tencent News Test Report - ${{ github.run_number }}
          to: yangcj20220508@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Test run #${{ github.run_number }} completed.
            Status: ${{ needs.test.result }}
            Report: https://${{ github.repository }}.github.io/${{ github.event.repository.name }}/