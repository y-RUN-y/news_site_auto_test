name: CI & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-pixi@v4

      - run: pixi install

      - run: pixi run install-playwright

      - run: pixi run run

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: report/html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: .

      - name: Deploy
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update test report" || exit 0
          git push -f origin gh-pages

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Tencent News Test Report - ${{ github.run_number }}
          to: 2080554836@qq.com
          from: Test Automation
          body: |
            Test run #${{ github.run_number }} completed.
            Status: ${{ needs.test.result }}
            Report: https://${{ github.repository }}.github.io/${{ github.event.repository.name }}/