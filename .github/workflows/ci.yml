name: CI & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - run: pixi install

      - run: pixi run npm install -g allure

      - run: pixi run install-playwright 

      - run: pixi run test

      - run: pixi run allure generate ./report/json -o ./report/html

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-report
          path: report/html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: .

      - name: Prepare gh-pages
        run: |
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf .
          cp -r report/html/* .
          rm -rf report
        shell: bash

      - name: Deploy
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update test report"
          git push -f origin gh-pages
        shell: bash

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Tencent News Test Report - ${{ github.run_number }}
          to: 2080554836@qq.com
          from: Test Automation
          body: |
            Test run #${{ github.run_number }} completed.
            Status: ${{ needs.test.result }}
            Report: https://${{ github.repository }}.github.io/${{ github.event.repository.name }}/